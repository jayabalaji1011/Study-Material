<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PySQL Master — Python & SQL Interview Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR NAV -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">PySQL<em>Master</em></span>
    </div>
    <button class="sidebar-close" id="sidebarClose">✕</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search topics..." autocomplete="off">
    <span class="search-icon">⌕</span>
  </div>

  <div class="nav-section">
    <div class="nav-lang-tabs">
      <button class="lang-tab active" data-lang="python">🐍 Python</button>
      <button class="lang-tab" data-lang="sql">🗄️ SQL</button>
    </div>
  </div>

  <nav class="topic-nav" id="topicNav"></nav>
</aside>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- MAIN -->
<main class="main" id="main">

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="topbar-title" id="topbarTitle">Python & SQL Master</div>
    <div class="topbar-actions">
      <button class="mode-btn" id="modeBtn" title="Toggle Dark/Light">🌙</button>
      <div class="progress-chip" id="progressChip">0%</div>
    </div>
  </header>

  <!-- HOME SCREEN -->
  <section class="home-screen" id="homeScreen">
    <div class="hero">
      <div class="hero-badge">Interview Ready</div>
      <h1 class="hero-title">Master <span>Python</span> &amp; <span>SQL</span></h1>
      <p class="hero-sub">From zero to interview-ready. Every topic explained with definitions, real-world examples, programs, and curated interview Q&amp;A.</p>
      <div class="hero-stats">
        <div class="stat"><strong id="statTopics">80+</strong><span>Topics</span></div>
        <div class="stat"><strong>500+</strong><span>Programs</span></div>
        <div class="stat"><strong>300+</strong><span>Interview Q&amp;A</span></div>
      </div>
      <div class="hero-btns">
        <button class="btn-primary" onclick="startLang('python')">🐍 Start Python</button>
        <button class="btn-secondary" onclick="startLang('sql')">🗄️ Start SQL</button>
      </div>
    </div>

    <div class="cards-grid" id="homeCards"></div>
  </section>

  <!-- TOPIC CONTENT SCREEN -->
  <section class="content-screen" id="contentScreen" style="display:none">
    <div class="content-header">
      <button class="back-btn" id="backBtn">← Back</button>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="topic-progress-bar"><div class="topic-progress-fill" id="topicProgressFill"></div></div>
    </div>

    <div class="content-tabs">
      <button class="ctab active" data-tab="learn">📖 Learn</button>
      <button class="ctab" data-tab="examples">💡 Examples</button>
      <button class="ctab" data-tab="practice">✏️ Practice</button>
      <button class="ctab" data-tab="interview">🎯 Interview</button>
    </div>

    <div class="content-body" id="contentBody">
      <div class="ai-loading" id="aiLoading">
        <div class="ai-spinner"></div>
        <p>Generating content with AI...</p>
      </div>
      <div id="learnTab" class="tab-pane active"></div>
      <div id="examplesTab" class="tab-pane" style="display:none"></div>
      <div id="practiceTab" class="tab-pane" style="display:none"></div>
      <div id="interviewTab" class="tab-pane" style="display:none"></div>
    </div>

    <div class="nav-footer">
      <button class="nav-arrow" id="prevTopic">← Prev</button>
      <button class="mark-done-btn" id="markDoneBtn">Mark as Done ✓</button>
      <button class="nav-arrow" id="nextTopic">Next →</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
